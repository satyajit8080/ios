name: AIWeightLossCoach
options:
  bundleIdPrefix: com.awlc
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
 
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Manual signing needs an explicit team. Codemagic's `use-profiles` fills in
    # PROVISIONING_PROFILE_SPECIFIER and CODE_SIGN_IDENTITY, but it does not set
    # DEVELOPMENT_TEAM, and without it xcodebuild reports "requires a
    # provisioning profile" even when a valid profile is installed.
    DEVELOPMENT_TEAM: 8L42VAKP6D
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
 
packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
 
targets:
  AIWeightLossCoach:
    type: application
    platform: iOS
    sources:
      - path: AIWeightLossCoach
    dependencies:
      - package: FirebaseSDK
        product: FirebaseCore
      - package: FirebaseSDK
        product: FirebaseMessaging
      - package: FirebaseSDK
        product: FirebaseAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.awlc.coach
        INFOPLIST_FILE: AIWeightLossCoach/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AIWeightLossCoach/Resources/AIWeightLossCoach.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: AIWeightLossCoach/Resources/AIWeightLossCoach.entitlements
