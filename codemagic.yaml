workflows:
  ios-testflight:
    name: AI Weight Loss Coach - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
 
    integrations:
      app_store_connect: AWLC_API_KEY
 
    environment:
      groups:
        - awlc_secrets
      vars:
        XCODE_PROJECT: "ios/AIWeightLossCoach.xcodeproj"
        XCODE_SCHEME: "AIWeightLossCoach"
        BUNDLE_ID: "com.awlc.coach"
      xcode: latest
 
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
 
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
 
      - name: Write GoogleService-Info.plist
        script: |
          # Stored as a base64 environment variable so the real Firebase
          # credentials never sit in the repository.
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode \
              > ios/AIWeightLossCoach/Resources/GoogleService-Info.plist
            echo "Wrote GoogleService-Info.plist"
          else
            echo "GOOGLE_SERVICE_INFO_PLIST not set - using the repo template."
          fi
 
      - name: Point the app at the live backend
        script: |
          # API_BASE_URL is an environment variable in Codemagic so the same
          # commit can be built against staging or production.
          if [ -n "$API_BASE_URL" ]; then
            /usr/libexec/PlistBuddy -c "Set :API_BASE_URL $API_BASE_URL" \
              ios/AIWeightLossCoach/Resources/Info.plist
            echo "API_BASE_URL set to $API_BASE_URL"
          fi
 
      - name: Generate the Xcode project
        script: |
          cd ios
          xcodegen generate
 
      - name: Set build number
        script: |
          cd ios
          # No builds exist yet on a brand-new app record, and the lookup exits
          # non-zero in that case rather than returning 0. Default to 0 so the
          # first build becomes number 1.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $((LATEST + 1))
 
      - name: Set up code signing
        script: |
          set -e
 
          keychain initialize
 
          # The signing key must be the SAME on every build. Generating a fresh
          # one per run means the existing certificate never matches, so each
          # build tries to create another and Apple rejects it with a 409 once
          # the two-certificate limit is reached. It lives in the
          # CERTIFICATE_PRIVATE_KEY environment variable instead.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
 
          # `--certificate-key` belongs to fetch-signing-files only. Passing it
          # here is an unknown argument and argparse exits 2 before the
          # certificate is ever imported. add-certificates picks up the .p12
          # that fetch-signing-files already saved to disk.
          keychain add-certificates
 
          xcode-project use-profiles \
            --project "$XCODE_PROJECT"
 
          echo "--- Provisioning profiles on disk ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" 2>/dev/null || true
 
      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
 
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/xcarchive/*.dSYM
 
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - satyajitdhumal07@gmail.com
        notify:
          success: true
          failure: true
