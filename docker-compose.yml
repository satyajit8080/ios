services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: awlc
      POSTGRES_PASSWORD: awlc
      POSTGRES_DB: awlc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awlc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv
      - ./secrets:/srv/secrets:ro
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./backend:/srv
      - ./secrets:/srv/secrets:ro
    command: ["python", "-m", "app.worker.scheduler"]

volumes:
  pgdata:
  redisdata:
