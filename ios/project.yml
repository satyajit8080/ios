name: AIWeightLossCoach
options:
  bundleIdPrefix: com.awlc
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ABCDE12345
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"

targets:
  AIWeightLossCoach:
    type: application
    platform: iOS
    sources:
      - path: AIWeightLossCoach
    dependencies:
      - package: FirebaseSDK
        product: FirebaseCore
      - package: FirebaseSDK
        product: FirebaseMessaging
      - package: FirebaseSDK
        product: FirebaseAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.awlc.coach
        INFOPLIST_FILE: AIWeightLossCoach/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AIWeightLossCoach/Resources/AIWeightLossCoach.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: AIWeightLossCoach/Resources/AIWeightLossCoach.entitlements
